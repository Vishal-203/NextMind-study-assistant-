<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Study Assistant - Register</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page cosmos-auth">
<main class="cosmos-shell">
  <header class="cosmos-brand">
    <div class="cosmos-orb"><span></span></div>
    <h1>NextMind</h1>
    <p>Create your stellar account</p>
  </header>

  <section class="cosmos-card">
    <div class="cosmos-tabs" role="tablist">
      <a href="index.html" role="tab">Sign in</a>
      <button class="active" type="button" role="tab" aria-selected="true">Sign up</button>
    </div>
    <p id="register-msg" class="cosmos-message" role="alert"></p>

    <label class="cosmos-field">
      <span>Full name</span>
      <input id="name" placeholder="Your name" autocomplete="name" />
    </label>
    <label class="cosmos-field">
      <span>Email address</span>
      <input id="email" placeholder="you@domain.com" type="email" autocomplete="email" />
    </label>
    <label class="cosmos-field password-field">
      <span>Password</span>
      <div class="cosmos-password-row">
        <input id="password" placeholder="••••••••" type="password" autocomplete="new-password" />
        <button id="toggle-password" type="button" aria-label="Show password">Show</button>
      </div>
    </label>
    <button class="cosmos-submit" id="register-btn" type="button">Create account</button>
    <p class="cosmos-signup">Already have an account? <a href="index.html">Sign in</a></p>
  </section>
</main>

<script src="app.js"></script>
<script src="neural-bg.js"></script>
<script>
const registerPassword = document.getElementById('password');
document.getElementById('toggle-password').onclick = function () {
  const showPassword = registerPassword.type === 'password';
  registerPassword.type = showPassword ? 'text' : 'password';
  this.textContent = showPassword ? 'Hide' : 'Show';
};
const registerBtn = document.getElementById('register-btn');
registerBtn.onclick = async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const result = await apiFetch('/auth/register', 'POST', {name, email, password});
  if(!result.success){ document.getElementById('register-msg').textContent = result.message; return; }
  window.location.href = 'index.html';
};
</script>
</body>
</html>
