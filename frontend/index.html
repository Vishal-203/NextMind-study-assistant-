<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Study Assistant - Login</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page cosmos-auth">
<div class="welcome-overlay" id="welcome-overlay">
  <div class="welcome-text" id="welcome-text">welcome to nextmind</div>
</div>

<main class="cosmos-shell">
  <header class="cosmos-brand">
    <div class="cosmos-orb"><span></span></div>
    <h1>NextMind</h1>
    <p>Stellar authentication portal</p>
  </header>

  <section class="cosmos-card" aria-labelledby="auth-title">
    <div class="cosmos-tabs" role="tablist">
      <button class="active" type="button" role="tab" aria-selected="true">Sign in</button>
      <a href="register.html" role="tab">Sign up</a>
    </div>

    <h2 id="auth-title" class="sr-only">Sign in</h2>
    <p id="login-msg" class="cosmos-message" role="alert"></p>

    <label class="cosmos-field">
      <span>Email address</span>
      <input id="email" placeholder="you@domain.com" type="email" autocomplete="email" required />
    </label>

    <label class="cosmos-field password-field">
      <span>Password</span>
      <div class="cosmos-password-row">
        <input id="password" placeholder="••••••••" type="password" autocomplete="current-password" required />
        <button id="toggle-password" type="button" aria-label="Show password">Show</button>
      </div>
    </label>

    <div class="cosmos-options">
      <label><input id="remember-me" type="checkbox" /> <span>Remember me</span></label>
      <button class="cosmos-link" id="forgot-password" type="button">Forgot password?</button>
    </div>

    <button class="cosmos-submit" id="login-btn" type="button">Launch sign in</button>

    <div class="cosmos-divider"><span>Or continue with</span></div>
    <div class="cosmos-socials">
      <button type="button" data-provider="Google"><span>G</span> Google</button>
      <button type="button" data-provider="GitHub"><span>◉</span> GitHub</button>
    </div>

    <p class="cosmos-signup">Don't have an account? <a href="register.html">Sign up</a></p>
  </section>
</main>

<script src="app.js"></script>
<script src="neural-bg.js"></script>
<script>
// Welcome Animation on Page Load
document.addEventListener('DOMContentLoaded', function() {
  const overlay = document.getElementById('welcome-overlay');
  const text = document.getElementById('welcome-text');
  
  // Check if this is the first visit (not from login/redirect)
  const hasVisited = sessionStorage.getItem('hasVisitedBefore');
  
  if (!hasVisited) {
    // First visit - show the welcome animation
    setTimeout(function() {
      overlay.classList.add('active');
      text.classList.add('animate-glow');
      
      // Hide after 3 seconds
      setTimeout(function() {
        overlay.classList.remove('active');
        overlay.classList.add('hidden');
        sessionStorage.setItem('hasVisitedBefore', 'true');
      }, 3000);
    }, 100);
  } else {
    // Already visited - don't show animation
    overlay.style.display = 'none';
  }
});

const passwordInput = document.getElementById('password');
document.getElementById('toggle-password').onclick = function () {
  const showPassword = passwordInput.type === 'password';
  passwordInput.type = showPassword ? 'text' : 'password';
  this.textContent = showPassword ? 'Hide' : 'Show';
  this.setAttribute('aria-label', showPassword ? 'Hide password' : 'Show password');
};
document.getElementById('forgot-password').onclick = () => {
  document.getElementById('login-msg').textContent = 'Password recovery will be available soon.';
};
document.querySelectorAll('.cosmos-socials button').forEach((button) => {
  button.onclick = () => {
    document.getElementById('login-msg').textContent = `${button.dataset.provider} sign-in is not configured yet.`;
  };
});

const rememberedEmail = localStorage.getItem('rememberedEmail');
if (rememberedEmail) {
  document.getElementById('email').value = rememberedEmail;
  document.getElementById('remember-me').checked = true;
}

const loginBtn = document.getElementById('login-btn');
loginBtn.onclick = async () => {

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const result = await apiFetch('/auth/login', 'POST', { email, password });
  if (!result.success) { document.getElementById('login-msg').textContent = result.message; return; }
  if (document.getElementById('remember-me').checked) localStorage.setItem('rememberedEmail', email);
  else localStorage.removeItem('rememberedEmail');
  setToken(result.data.token); localStorage.setItem('user', JSON.stringify(result.data.user));
  window.location.href='dashboard.html';
};
</script>
</body>
</html>
