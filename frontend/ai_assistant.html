<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Assistant | AI Study Assistant</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="ai-chat-page">
<div class="ai-shell">
  <header class="ai-topbar">
    <a class="ai-brand" href="dashboard.html" aria-label="NextMind dashboard"><span class="ai-brand-mark">N</span><span>NextMind</span></a>
    <nav class="ai-tabs" aria-label="AI workspace navigation">
      <button class="ai-tab active" type="button">Chat</button>
      <a class="ai-tab" href="notebook.html">Archive</a>
      <a class="ai-tab" href="profile.html">Settings</a>
    </nav>
    <div class="ai-top-actions">
      <button class="ai-icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
      <a class="ai-upgrade" href="dashboard.html">Dashboard</a>
    </div>
  </header>

  <main class="ai-workspace">
    <section class="ai-welcome" id="ai-welcome">
      <div class="ai-spark">✦</div>
      <p class="ai-date-label">NextMind AI</p>
      <h1>Good morning.<br><span>What will you learn today?</span></h1>
    </section>

    <div id="answer" class="ai-answer result-panel" style="display:none"></div>

    <section class="ai-composer-wrap" aria-label="Ask NextMind">
      <div class="ai-context-row">
        <select id="file-select" class="ai-context-select" aria-label="Study file">
          <option value="">⌁ Deep Thinking</option>
        </select>
        <select id="note-select" class="ai-context-select" aria-label="Study note">
          <option value="">✦ Study Context</option>
        </select>
      </div>
      <div class="ai-composer">
        <textarea id="question" rows="1" placeholder="Ask anything about your study material..."></textarea>
        <button class="ai-send" id="ask-btn" type="button" aria-label="Send question">↑</button>
      </div>
      <div class="ai-status-row">
        <span id="file-status">Deep search</span>
        <span id="note-status">Study context</span>
      </div>
      <button class="sr-only" id="refresh-files" type="button">Refresh files</button>
      <button class="sr-only" id="refresh-notes" type="button">Refresh notes</button>
      <button class="sr-only" id="analyze-file-btn" type="button">Analyze file</button>
    </section>

    <section class="ai-starter-grid" aria-label="AI tools">
      <button class="ai-starter-card" id="starter-deep" type="button">Explain a difficult<br>concept from my materials</button>
      <button class="ai-starter-card" id="starter-summary" type="button">Summarize what I<br>need to revise</button>
      <button class="ai-starter-card" id="starter-quiz" type="button">Create a quiz to test<br>my understanding</button>
      <button class="ai-starter-card" id="starter-plan" type="button">Build a study plan<br>from my notes</button>
      <button class="ai-starter-card" id="starter-source" type="button">Generate source<br>ideas for a topic</button>
    </section>

    <section class="ai-tools" aria-label="Advanced AI tools">
      <div class="ai-tool-item"><label for="summary-text">Synthesis</label><textarea id="summary-text" rows="2" placeholder="Paste text or choose study context..."></textarea><div class="ai-tool-actions"><button id="summarize-btn" type="button">Summarize</button><button id="summarize-file-btn" type="button">File</button><button id="summarize-note-btn" type="button">Note</button></div><div id="summary" class="ai-answer result-panel" style="display:none"></div></div>
      <div class="ai-tool-item"><label for="quiz-topic">Evaluation</label><input id="quiz-topic" placeholder="Enter a topic" /><button id="quiz-btn" type="button">Generate quiz</button><pre id="quiz" style="display:none"></pre></div>
    </section>
  </main>

  <footer class="ai-footer"><span>NextMind AI</span><span>Study assistant</span><span>Private workspace</span></footer>
</div>

<script src="app.js"></script>
<script src="neural-bg.js"></script>
<script>
requireAuth();
initDarkMode();
if (localStorage.getItem('darkMode') === 'false') {
  document.body.classList.add('ai-light-theme');
}

const themeToggle = document.getElementById('theme-toggle');
if (themeToggle) {
  themeToggle.onclick = () => {
    const useLightTheme = document.body.classList.toggle('ai-light-theme');
    localStorage.setItem('darkMode', useLightTheme ? 'false' : 'true');
    themeToggle.textContent = useLightTheme ? '☀' : '◐';
  };
}

const starterPrompts = {
  'starter-deep': 'Explain the most difficult concept in my selected study material in simple terms.',
  'starter-summary': 'Create a focused revision summary from my selected study context.',
  'starter-quiz': '',
  'starter-plan': 'Create a practical study plan from my selected notes and resources.',
  'starter-source': 'Suggest reliable source topics and search areas for the subject in my study context.'
};
Object.entries(starterPrompts).forEach(([id, prompt]) => {
  const button = document.getElementById(id);
  if (!button) return;
  button.onclick = () => {
    if (id === 'starter-quiz') {
      document.getElementById('quiz-topic').focus();
      document.getElementById('quiz-topic').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    document.getElementById('question').value = prompt;
    document.getElementById('ask-btn').click();
  };
});

document.getElementById('logout-sidebar').onclick = (e) => {
  e.preventDefault();
  clearToken();
  localStorage.removeItem('user');
  window.location = 'index.html';
};

async function display(eid, endpoint, payload, btn){
  const out = document.getElementById(eid);
  if (btn) {
    btn.disabled = true;
    btn.dataset.originalText = btn.textContent;
    btn.textContent = 'Processing...';
  }
  out.style.display = 'none';
  out.textContent = '';
  
  const res = await apiFetch(endpoint, 'POST', payload);
  if (btn) {
    btn.disabled = false;
    btn.textContent = btn.dataset.originalText;
  }
  
  if(!res.success){ 
    out.innerHTML = `<span style="color:var(--badge-danger)">${res.message}</span>`; 
    out.style.display = 'block';
    return; 
  }
  
  const data = res.data.answer || res.data.summary || res.data.quiz || res.data.text;
  out.textContent = data;
  out.style.display = 'block';
}

async function loadFileOptions() {
  const select = document.getElementById('file-select');
  const status = document.getElementById('file-status');
  const res = await apiFetch('/files');
  select.innerHTML = '<option value="">-- No file selected --</option>';
  if (!res.success || !Array.isArray(res.data) || res.data.length === 0) {
    status.textContent = 'No resources found.';
    return;
  }
  res.data.forEach(file => {
    const option = document.createElement('option');
    option.value = file.id;
    option.textContent = `${file.filename} (${(file.size/1024).toFixed(1)} KB)`;
    select.appendChild(option);
  });
  status.textContent = `${res.data.length} resource(s) active.`;
}

async function loadNoteOptions() {
  const select = document.getElementById('note-select');
  const status = document.getElementById('note-status');
  const res = await apiFetch('/notes?limit=50');
  select.innerHTML = '<option value="">-- No note selected --</option>';
  const items = Array.isArray(res?.data?.items) ? res.data.items : [];
  if (!res.success || items.length === 0) {
    status.textContent = 'No nodes connected.';
    return;
  }
  items.forEach(note => {
    const option = document.createElement('option');
    option.value = note.id;
    option.textContent = `${note.subject} - ${note.topic}`;
    select.appendChild(option);
  });
  status.textContent = `${items.length} node(s) connected.`;
}

document.getElementById('ask-btn').onclick = async function() {
  const q = document.getElementById('question').value.trim();
  if(!q) {
    document.getElementById('answer').textContent = 'Enter a question first.';
    document.getElementById('answer').style.display = 'block';
    return;
  }
  const fileId = document.getElementById('file-select').value || null;
  const noteId = document.getElementById('note-select').value || null;
  const payload = { message: q };
  if (fileId) payload.file_id = fileId;
  if (noteId) payload.note_id = noteId;
  display('answer','/ai/chat', payload, this);
};

document.getElementById('summarize-btn').onclick = async function() {
  const text = document.getElementById('summary-text').value.trim();
  if(!text) {
    document.getElementById('summary').textContent = 'Enter text to summarize.';
    document.getElementById('summary').style.display = 'block';
    return;
  }
  display('summary','/ai/summarize',{text}, this);
};

document.getElementById('summarize-file-btn').onclick = async function() {
  const fid = document.getElementById('file-select').value;
  if(!fid) {
    document.getElementById('summary').textContent = 'Select a file to summarize.';
    document.getElementById('summary').style.display = 'block';
    return;
  }
  display('summary','/ai/summarize',{file_id: fid}, this);
};

document.getElementById('summarize-note-btn').onclick = async function() {
  const nid = document.getElementById('note-select').value;
  if(!nid) {
    document.getElementById('summary').textContent = 'Select a note to summarize.';
    document.getElementById('summary').style.display = 'block';
    return;
  }
  display('summary','/ai/summarize',{note_id: nid}, this);
};

document.getElementById('quiz-btn').onclick = async function() {
  const topic = document.getElementById('quiz-topic').value.trim();
  if(!topic) {
    document.getElementById('quiz').textContent = 'Enter a topic first.';
    document.getElementById('quiz').style.display = 'block';
    return;
  }
  display('quiz','/ai/quiz',{topic}, this);
};

document.getElementById('analyze-file-btn').onclick = async function() {
  const fileId = document.getElementById('file-select').value;
  if (!fileId) {
    document.getElementById('file-status').textContent = 'Select a file before analysis.';
    return;
  }
  const status = document.getElementById('file-status');
  this.disabled = true;
  this.textContent = 'Analyzing...';
  status.textContent = 'Extracting readable text...';
  const result = await apiFetch('/ai/analyze-file', 'POST', { file_id: fileId });
  this.disabled = false;
  this.textContent = 'Analyze Selected File';
  if (!result.success) {
    status.textContent = result.message;
    return;
  }
  status.textContent = `${result.data.filename}: ${result.data.character_count} characters extracted.`;
};

document.getElementById('refresh-files').onclick = loadFileOptions;
document.getElementById('refresh-notes').onclick = loadNoteOptions;

loadFileOptions();
loadNoteOptions();
</script>
</body>
</html>
